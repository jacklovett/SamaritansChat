<app-loading [isCenter]="true" [isLoading]="isLoading"></app-loading>
<mat-card class="container-margin" [hidden]="isLoading">
  <mat-toolbar
    >Users
    <mat-icon
      matTooltip="Add User"
      class="material-icons material-icons-btn toolbar-icon"
      (click)="addUser()"
      >add_circle</mat-icon
    ></mat-toolbar
  >
  <app-table
    *ngIf="users.length"
    [data]="users"
    [columnDetails]="columnDetails"
  ></app-table>
</mat-card>
